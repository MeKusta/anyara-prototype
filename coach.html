<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1200">
<title>Anyara — Valeria Méndez</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="logo"><b>A</b>nyara</a>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">Para ti</a>
      <a href="explorar.html" class="nav-link">Explorar</a>
      <a href="series.html" class="nav-link">Series</a>
      <a href="retos.html" class="nav-link">Retos</a>
      <a href="events.html" class="nav-link">Eventos</a>
      <a href="onboarding.html" class="nav-link" style="color:var(--ink-3)">(Onboarding)</a>
      <a href="estilo.html" class="nav-link" style="color:var(--ink-3)">(Estilo)</a>
      <a href="materiales.html" class="nav-link" style="color:var(--ink-3)">(Material)</a>
    </nav>
    <div class="nav-right">
      <button class="icon-btn" onclick="document.getElementById('ov').classList.add('open')">⌕</button>
      <a href="profile.html" class="avatar">PK</a>
    </div>
  </div>
</header>

<div class="wrap section-sm">
  <a href="coaches.html" style="font-family:var(--sans);font-size:var(--fs-meta);color:var(--ink-2)">Todas las coaches</a>
</div>

<!-- portada a lo ancho; el degradado sustituye a la foto.
     Todo el contenido del perfil sale de Anyara.INSTRUCTORS, que es la misma
     fuente que usa la ficha de clase y el directorio: ya no hay un perfil
     escrito a mano para una sola instructora. -->
<div class="wrap section-sm">
  <div class="cover gart" id="cover">
    <div class="cover-in">
      <h1 class="coach-name" id="cName"></h1>
      <div class="cover-meta" id="cMeta"></div>
      <!-- Disciplinas que imparte. Acordado en la llamada: en el perfil tiene
           que verse qué enseña, y cada etiqueta lleva a esa disciplina. -->
      <div class="coach-tags" id="coachTags"></div>
      <!-- seguir vive con la identidad, no perdido al lado de la bio. Las
           redes son opcionales: cada instructora llena las que tenga y las
           vacías no se pintan. -->
      <div class="cover-cta">
        <button class="btn btn-gold follow" id="fw" onclick="toggleFollow()">＋ Seguir</button>
        <div class="socials" id="socials"></div>
      </div>
    </div>
  </div>
</div>

<div class="wrap section-sm">
  <p class="coach-bio" id="cBio"></p>
</div>

<div class="wrap section-sm">
  <div class="row-head"><h2 class="h2-serif" id="cHead">Sus clases</h2><a href="explorar.html">Ver todas</a></div>
  <div class="grid4" id="cGrid"></div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <div><div class="logo"><b>A</b>nyara</div><p class="about">Muévete con intención.</p></div>
    <div><h5>Plataforma</h5><a href="explorar.html">Explorar clases</a><a href="coaches.html">Coaches</a><a href="membresia.html">Planes y precios</a></div>
    <div><h5>Empresa</h5><a href="#">Quiénes somos</a><a href="#">Términos</a></div>
    <div><h5>Redes</h5><a href="#">Instagram</a><a href="#">TikTok</a></div>
  </div>
</footer>

<div class="overlay" id="ov">
  <button class="overlay-close" onclick="document.getElementById('ov').classList.remove('open')">✕</button>
  <div class="overlay-top">
    <div class="search-field"><span style="font-size:var(--fs-title);color:var(--ink-3)">⌕</span><input placeholder="Busca clases, coaches, disciplinas…"></div>
  </div>
</div>

<script src="anyara.js"></script>
<script>
/* ?c= elige la instructora; sin parámetro cae en Valeria, que es la que
   usábamos como ejemplo antes de que el perfil fuera genérico. */
var COACH = new URLSearchParams(location.search).get('c') || 'Valeria Méndez';
var prof  = Anyara.INSTRUCTORS[COACH] || Anyara.INSTRUCTORS['Valeria Méndez'];

document.title = 'Anyara — ' + COACH;
document.getElementById('cover').classList.add(prof.art);
document.getElementById('cName').textContent = COACH;
document.getElementById('cMeta').textContent = prof.cifras || '';
document.getElementById('cBio').textContent  = prof.bio;
document.getElementById('cHead').textContent = 'Clases de ' + COACH.split(' ')[0];
document.getElementById('coachTags').innerHTML = Anyara.coachTags(COACH);
document.getElementById('socials').innerHTML   = Anyara.coachSocials(COACH);

/* sus clases salen del catálogo compartido, con las mismas reglas de acceso
   que el resto del sitio */
document.getElementById('cGrid').innerHTML = Anyara.classesBy(COACH, 4).map(function (c) {
  var locked = !Anyara.canWatch({ free: c.free });
  return '<a href="' + Anyara.classHref({ t:c.t, i:c.i, d:c.d, m:c.m, x:c.x, free:c.free ? 1 : 0 }) + '" class="ccard">' +
    '<div class="art gart ' + c.d + '">' +
      (c.free ? '<span class="free">Gratis</span>' : '') +
      '<span class="len">' + c.m + ':00</span>' +
      (locked ? '<span class="locked">🔒 Membresía</span>' : '') +
    '</div>' +
    '<div class="title">' + c.t + '</div>' +
    '<div class="meta">' + c.i + '</div>' +
    '<div class="lvl">' + c.x + '</div>' +
    '<div class="tag disc-link" data-d="' + c.d + '">' + Anyara.discLabel(c.d).toUpperCase() + '</div></a>';
}).join('');
Anyara.paintArt();
Anyara.paintFavs();

function toggleFollow(){
  var b=document.getElementById('fw');
  var on=b.classList.toggle('on');
  b.textContent = on ? '✓ Siguiendo' : '＋ Seguir';
}
</script>
</body>
</html>
